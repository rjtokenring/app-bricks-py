cache_path: .licenses

apps:
  - name: arduino-app-bricks
    source_path: .
    sources:
      pip: true
    python:
      virtual_env_dir: ".licensed-venv"

  - name: python-base
    source_path: .
    sources:
      pip: true
    python:
      virtual_env_dir: "containers/base/python-base/.licensed-venv"

  # The framework's own runtime dependencies (websockets, flask, waitress) live with the
  # shared sources in containers/ai/aihub-framework; both runner bases install them.
  - name: aihub-framework
    source_path: .
    sources:
      pip: true
    python:
      virtual_env_dir: "containers/ai/aihub-framework/.licensed-venv"

  # OpenCV and ai-edge-litert, shared by every runner built on this base
  # (gesture-recognition-runner, pose-estimation-runner) and installed here once.
  - name: aihub-models-runner
    source_path: .
    sources:
      pip: true
    python:
      virtual_env_dir: "containers/ai/aihub-models-runner/.licensed-venv"

  - name: models-downloader
    source_path: .
    sources:
      pip: true
    python:
      virtual_env_dir: "containers/bricks/models-downloader/.licensed-venv"

stale_records_action: error

ignored:
  pip:
    - pip
    - setuptools
    - wheel
    - uv
    - arduino-app-bricks
    - arduino_app_bricks

# Packages whose wheel metadata licensee cannot classify (missing or
# unrecognized license text in the distribution); licenses verified manually.
reviewed:
  pip:
    - defusedxml        # PSF-2.0
    - langchain-core    # MIT
    - langsmith         # MIT
    - ai-edge-litert    # Apache-2.0
    - tzdata            # Apache-2.0

allowed:
  - mpl-2.0
  - apache-2.0
  - mit
  - mit-cmu
  - bsd-2-clause
  - bsd-3-clause
  - cc0-1.0
  - isc
  - psf-2.0
  - unlicense
  - ofl-1.1
  - lgpl-3.0-only
  - epl-2.0
  - zpl-2.1
