# Python packages this image installs, pinned with hashes in uv.lock, see containers/README.md
#
# The phonemes come from the espeak-ng program of the Debian package, run as a child
# process (src/text.py), so no phonemizer package is installed here: kokoro-onnx would
# bring in phonemizer and espeakng-loader, which are GPL-3.0 and cannot enter the lock.
[project]
name = "kokoro-tts-runner"
version = "0"
requires-python = "==3.13.*"
dependencies = [
    "numpy==2.5.3",
    "onnxruntime==1.29.0",
]

# Test-only packages, not exported into the image, task test runs the suite with them
[dependency-groups]
test = ["pytest"]

[tool.uv]
# The images run on aarch64 Linux, the lock must resolve for that target but installs on developer machines too
required-environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
# Declared by the onnxruntime wheel but never imported at runtime: sympy (+ mpmath, ~80 MB)
# is only used by onnxruntime's offline tooling, coloredlogs (+ humanfriendly) by its CLI.
# A marker that never holds keeps them out of the lock, and so out of the image.
override-dependencies = [
    "sympy; sys_platform == 'never'",
    "coloredlogs; sys_platform == 'never'",
]
